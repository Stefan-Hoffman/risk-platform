version: 2
# Security-first policy: disable routine version-update PRs.
# Enable Dependency graph, Dependabot alerts, and Dependabot security updates
# in repository settings. These settings cannot be enabled by this file.
# The schedule is required by the schema; security fixes are alert-driven.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # This disables image-version PRs; it does not scan image contents.
    open-pull-requests-limit: 0
